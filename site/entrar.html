<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Entrar · Base de conhecimento pessoal</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone-180.png">
<style>
/* Central de ajustes: mesmas cores e fonte do app */
:root { --cor-destaque: #FF4F18; --cor-texto: #141517; --cor-secundaria: #5B6470; --cor-fundo: #FFFFFF; --cor-fundo-2: #F2F4F7; --cor-linha-forte: #DCE0E6; --fonte: "Manrope", ui-sans-serif, system-ui, sans-serif; }
@font-face { font-family: "Manrope"; src: url("/fontes/manrope-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px; font-family: var(--fonte); color: var(--cor-texto); background: var(--cor-fundo); letter-spacing: -.011em; -webkit-font-smoothing: antialiased; }
::selection { background: var(--cor-destaque); color: #fff; }
form { width: 100%; max-width: 380px; display: grid; gap: 18px; }
img { width: 64px; height: 64px; border-radius: 16px; }
h1 { margin: 6px 0 0; font-size: 1.75rem; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
p { margin: 0; color: var(--cor-secundaria); font-size: .9375rem; line-height: 1.5; }
input { width: 100%; font: inherit; font-size: 1.0625rem; padding: 15px 16px; border: 1px solid var(--cor-linha-forte); border-radius: 12px; caret-color: var(--cor-destaque); }
input:focus { outline: none; border-color: var(--cor-texto); }
button { font: inherit; font-weight: 700; font-size: 1rem; min-height: 54px; border: 0; border-radius: 100px; background: var(--cor-texto); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 7px 0 24px; }
button span { width: 40px; height: 40px; border-radius: 50%; background: var(--cor-destaque); display: grid; place-items: center; font-size: 20px; }
.erro { color: #B3261E; font-weight: 650; font-size: .875rem; min-height: 1.2em; }
</style>
</head>
<body>
<form method="post" action="/entrar">
  <img src="/icone-192.png" alt="">
  <h1>Base de conhecimento pessoal</h1>
  <p>Tudo o que você aprendeu, organizado e pronto para lembrar.</p>
  <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required autofocus aria-label="Senha">
  <p class="erro" id="erro" role="alert"></p>
  <button type="submit">Entrar <span aria-hidden="true">→</span></button>
</form>
<script>
const e = new URLSearchParams(location.search).get("erro");
if (e) document.getElementById("erro").textContent = e === "bloqueado" ? "Muitas tentativas. Espere 10 minutos." : "Senha errada. Tente de novo.";
</script>
</body>
</html>
